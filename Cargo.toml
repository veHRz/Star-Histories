[workspace]
members = ["crates/*", "tools/sh_import", "tools/sh_audio"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
publish = false

[workspace.dependencies]
# Moteur et écosystème Bevy (compatibilité 0.20 vérifiée, AGENTS.md §5.3).
bevy = { version = "0.20.1", features = ["wav"] }
bevy_enhanced_input = "0.27"
bevy-inspector-egui = "0.38"
avian3d = "0.8"
# Crates pures.
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ron = "0.12"
thiserror = "2"
rand = "0.10"
rand_chacha = "0.10"
# Crates du projet.
sh_core = { path = "crates/sh_core" }
sh_data = { path = "crates/sh_data" }
sh_sim = { path = "crates/sh_sim" }
sh_game = { path = "crates/sh_game" }

# Les systèmes Bevy prennent naturellement beaucoup de paramètres et des types de requête longs.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[workspace.lints.rust]
unsafe_code = "forbid"

[package]
name = "star_histories"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true

[lints]
workspace = true

[dependencies]
bevy.workspace = true
sh_game.workspace = true

[features]
# Développement uniquement : liaison dynamique (recompilations rapides) + outils de debug Bevy
# et du jeu (inspecteur, caméra libre, affichage des performances).
# Lancer avec `cargo dev` (alias défini dans .cargo/config.toml). Jamais dans un build distribué.
dev = ["bevy/dynamic_linking", "bevy/dev", "sh_game/dev"]

# Le code du jeu reste rapide à compiler, les dépendances sont optimisées une fois pour toutes.
[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
codegen-units = 1
lto = "thin"
